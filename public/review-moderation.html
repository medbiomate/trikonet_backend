<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trikonet review moderation</title><style>body{font:15px system-ui;background:#f7f5f3;color:#25252a;max-width:900px;margin:40px auto;padding:20px}article{padding:24px;background:white;border:1px solid #ddd;border-radius:16px;margin:16px 0}button{padding:12px;margin:6px;border:1px solid #ccc;border-radius:8px;background:white;cursor:pointer}p{white-space:pre-wrap}small{color:#666}</style><a href="/admin">Back to admin</a><h1>Review moderation</h1><p>Approve only appropriate, relevant experiences. Reject abuse, threats, hate, spam, private information and unlawful content. Existing unmoderated reviews remain hidden until approved. Check reports regularly and act promptly.</p><button id="reload">Refresh queue</button><p id="status" role="status"></p><h2>Ad concerns</h2><button id="ads">Load ad reports</button><div id="ad-list"></div><h2>Company reviews</h2><main id="list"></main><script type="module">
const status=document.querySelector('#status'),list=document.querySelector('#list');async function request(data){const response=await fetch('/api/admin/review-moderation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw Error(result.error||'Request failed');return result}async function load(){status.textContent='Loading…';try{const data=await request({action:'list'});list.replaceChildren();for(const review of data.reviews){const card=document.createElement('article'),title=document.createElement('h2'),text=document.createElement('p'),meta=document.createElement('small');title.textContent=`${review.companyId} · ${review.rating}/5`;text.textContent=review.text;meta.textContent=`${review.name} · ${review.status||'pending'} · ${review.id}`;card.append(title,meta,text);for(const report of data.reports.filter(r=>r.reviewId===review.id)){const p=document.createElement('p');p.textContent='Reported: '+report.reason;card.append(p)}for(const [action,label]of [['approve','Approve'],['reject','Reject / remove'],['suspend-author','Suspend reviewer'],['restore-author','Restore reviewer']]){const button=document.createElement('button');button.textContent=label;button.onclick=async()=>{button.disabled=true;try{await request({action,reviewId:review.id});await load()}catch(error){status.textContent=error.message;button.disabled=false}};card.append(button)}list.append(card)}status.textContent=`${data.reviews.length} items in queue.`}catch(error){status.textContent=error.message+' Sign in at /admin with a moderator account.'}}document.querySelector('#ads').onclick=async()=>{try{const response=await fetch('/api/admin/ad-reports',{method:'POST'});const data=await response.json();if(!response.ok)throw Error(data.error);const list=document.querySelector('#ad-list');list.replaceChildren();for(const report of data.reports){const p=document.createElement('p');p.textContent=`${report.reference} · ${new Date(report.at).toLocaleString()} · ${report.placement}\n${report.reason}`;list.append(p)}}catch(error){status.textContent=error.message}};document.querySelector('#reload').onclick=load;load();
</script></html>
